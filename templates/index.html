{% extends "base.html" %}
{% block content %}
<div class="flex flex-col h-full" id="chat-layout" style="background:var(--bg-chat);">
    <div id="chat-messages" class="flex-1 overflow-auto p-3">
        <div class="chat-welcome">
            <h2 class="chat-welcome-title">多智能体协作系统</h2>
            <p class="chat-welcome-sub" id="welcome-mode-label">使用 <strong>自动</strong> 模式进行对话</p>
            <div class="welcome-modes">
                <div class="welcome-mode" data-value="auto" onclick="selectWelcomeMode(this)">
                    <div class="welcome-mode-icon">⚡</div>
                    <div class="welcome-mode-name">自动</div>
                    <div class="welcome-mode-desc">AI 判断任务复杂度</div>
                </div>
                <div class="welcome-mode" data-value="fast" onclick="selectWelcomeMode(this)">
                    <div class="welcome-mode-icon">💬</div>
                    <div class="welcome-mode-name">快速</div>
                    <div class="welcome-mode-desc">直接回复，无需协作</div>
                </div>
                <div class="welcome-mode" data-value="slow" onclick="selectWelcomeMode(this)">
                    <div class="welcome-mode-icon">🤖</div>
                    <div class="welcome-mode-name">协作</div>
                    <div class="welcome-mode-desc">多智能体流水线</div>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-input-area" id="drop-zone">
        <div id="drag-overlay" class="drag-overlay">释放文件以上传</div>
        <div id="file-tags" class="file-tags"></div>
        <form id="chat-form" class="input-wrapper">
            <textarea id="chat-input" rows="3"
                   placeholder="给 Multi-Agent 发送任务（编程 / 写作 / 分析 / 问答 / 闲聊）"
                   autofocus></textarea>
            <button type="button" class="attach-btn" id="attach-btn" title="上传附件">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="file-input" hidden>
            <button type="submit" class="send-btn" title="发送 (Enter)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 11 7-7 7 7M12 4v16"/></svg>
            </button>
            <div class="mode-bar">
                <span class="mode-chip active" data-value="auto" onclick="selectLane(this)">自动</span>
                <span class="mode-chip" data-value="fast" onclick="selectLane(this)">快速</span>
                <span class="mode-chip" data-value="slow" onclick="selectLane(this)">协作</span>
            </div>
        </form>
        <div id="ai-disclaimer" class="ai-disclaimer">内容由 AI 生成，请仔细甄别</div>
    </div>
    <script>
    // 输入框自动扩展
    document.getElementById('chat-input').addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    });

    // 欢迎页模式选择
    function selectWelcomeMode(el) {
        var val = el.getAttribute('data-value');
        // 同步侧栏悬浮弹窗
        if (typeof selectLane === 'function') {
            var target = document.querySelector('.lane-option[data-value="' + val + '"]');
            if (target) selectLane(target);
        }
        // 更新高亮
        document.querySelectorAll('.welcome-mode').forEach(function(m) {
            m.classList.toggle('active', m === el);
        });
        document.getElementById('welcome-mode-label').innerHTML =
            '使用 <strong>' + el.querySelector('.welcome-mode-name').textContent + '</strong> 模式进行对话';
    }
    // 默认高亮自动 + 整体居中
    document.addEventListener('DOMContentLoaded', function() {
        var auto = document.querySelector('.welcome-mode[data-value="auto"]');
        if (auto) auto.classList.add('active');
        var layout = document.getElementById('chat-layout');
        if (layout) layout.classList.add('welcome-active');
    });
    </script>
</div>
{% endblock %}
